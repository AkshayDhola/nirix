[package]
name = "nirix"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
crossterm = { version = "0.29.0", default-features = false, features = ["events", "bracketed-paste"] }
libc = "0.2"
vt100 = "0.18.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
